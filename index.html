<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compare AI</title>

<style>

body{
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#dbeafe,#ffffff);
text-align:center;
padding:20px;
}

.container{
background:white;
max-width:900px;
margin:auto;
padding:30px;
border-radius:25px;
box-shadow:0 5px 25px #aaa;
}

h1{
font-size:42px;
color:#2563eb;
}

input{
width:80%;
padding:15px;
margin:10px;
font-size:20px;
border-radius:12px;
border:1px solid #aaa;
}

button{
padding:15px 35px;
margin:10px;
font-size:18px;
background:#2563eb;
color:white;
border:none;
border-radius:12px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

table{
width:100%;
border-collapse:collapse;
margin-top:25px;
}

td,th{
border:1px solid #ccc;
padding:15px;
}

th{
background:#eef2ff;
}

.check{
font-size:25px;
}

.winner{
font-size:30px;
font-weight:bold;
margin-top:25px;
}

.explanation{
font-size:18px;
line-height:1.7;
margin-top:20px;
}

.history{
background:#f8fafc;
padding:15px;
margin-top:25px;
border-radius:15px;
text-align:right;
}

.item{
padding:10px;
border-bottom:1px solid #ddd;
}

</style>

</head>


<body>


<div class="container">

<h1>🧠 Compare AI</h1>

<p>
השווה בין שני דברים וקבל החלטה חכמה
</p>


<input id="first" placeholder="הכנס דבר ראשון">

<br>

<input id="second" placeholder="הכנס דבר שני">


<br>


<button onclick="compare()">
השווה
</button>


<button onclick="showHistory()">
📜 היסטוריה
</button>


<button onclick="clearHistory()">
🗑 מחק היסטוריה
</button>


<div id="result"></div>


<div id="history"></div>


</div>



<script>


let history =
JSON.parse(localStorage.getItem("compareHistory")) || [];



function randomWinner(a,b){

let r=Math.random();

if(r<0.5){
return a;
}

else{
return b;
}

}



function compare(){


let first =
document.getElementById("first").value.trim();


let second =
document.getElementById("second").value.trim();



if(!first || !second){

alert("צריך להכניס שני דברים");
return;

}



if(first.toLowerCase()==second.toLowerCase()){

document.getElementById("result").innerHTML=
`
<h2>😄 אי אפשר להשוות משהו לעצמו</h2>
`;

return;

}



let text =
(first+" "+second).toLowerCase();



let categories=[];

let type="השוואה כללית";



if(
text.includes("מסי") ||
text.includes("רונאלדו") ||
text.includes("אמבפה") ||
text.includes("האלנד")
){


type="⚽ כדורגל";


categories=[

"מהירות",
"בעיטות",
"דריבל",
"מסירות",
"כוח פיזי",
"סיומת"

];


}



else if(
text.includes("אייפון") ||
text.includes("גלקסי") ||
text.includes("iphone") ||
text.includes("samsung")
){


type="📱 טכנולוגיה";


categories=[

"מצלמה",
"סוללה",
"ביצועים",
"מחיר",
"עיצוב"

];


}


else{


categories=[

"איכות",
"מחיר",
"נוחות",
"פופולריות",
"יתרונות"

];


}


let scoreFirst = 0;
let scoreSecond = 0;

let rows = "";

let details = [];



categories.forEach(category => {


let winner = randomWinner(first, second);


if(winner === first){

scoreFirst++;

}
else{

scoreSecond++;

}


rows += `

<tr>

<td>${category}</td>

<td class="check">
${winner === first ? "✅" : ""}
</td>


<td class="check">
${winner === second ? "✅" : ""}
</td>

</tr>

`;


details.push(
`${category}: היתרון אצל ${winner}`
);


});



let finalWinner;

if(scoreFirst > scoreSecond){

finalWinner = first;

}

else if(scoreSecond > scoreFirst){

finalWinner = second;

}

else{

finalWinner = randomWinner(first, second);

}



let explanation = `

ההשוואה בין <b>${first}</b> לבין <b>${second}</b> נבדקה לפי ${categories.length} קטגוריות בתחום ${type}.

<br><br>

`;



details.forEach(d=>{

explanation += "• " + d + "<br>";

});



explanation += `

<br>

בסיכום הכולל, ${finalWinner} קיבל יותר יתרונות בקטגוריות שנבדקו ולכן נבחר כמנצח.

חשוב לזכור: התוצאה מבוססת על קטגוריות ההשוואה ולא אומרת שכל אדם בהכרח יעדיף אותו.

`;



let result = `


<h2>${first} מול ${second}</h2>

<h3>${type}</h3>


<table>

<tr>

<th>קטגוריה</th>

<th>${first}</th>

<th>${second}</th>

</tr>


${rows}


</table>


<div class="winner">

🏆 המנצח: ${finalWinner}

</div>


<div class="explanation">

${explanation}

</div>


`;



document.getElementById("result").innerHTML = result;



let save = {

first:first,

second:second,

winner:finalWinner,

date:new Date().toLocaleString("he-IL")

};



history.unshift(save);



if(history.length > 20){

history.pop();

}



localStorage.setItem(
"compareHistory",
JSON.stringify(history)
);



}




function showHistory(){


let box = document.getElementById("history");


if(history.length===0){

box.innerHTML =
"<h3>אין עדיין השוואות</h3>";

return;

}



let html = `

<h2>📜 השוואות אחרונות</h2>

`;



history.forEach(item=>{


html += `

<div class="item">

<b>${item.first}</b> מול <b>${item.second}</b>

<br>

🏆 ${item.winner}

<br>

${item.date}

</div>


`;

});


box.innerHTML = html;


}




function clearHistory(){


history=[];


localStorage.removeItem(
"compareHistory"
);


document.getElementById("history").innerHTML =
"<h3>ההיסטוריה נמחקה</h3>";

}


</script>


</body>

</html>
