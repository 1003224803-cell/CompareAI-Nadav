<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compare AI</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#dbeafe,#ffffff);
text-align:center;
padding:30px;
}

.box{
background:white;
max-width:850px;
margin:auto;
padding:30px;
border-radius:20px;
box-shadow:0 5px 20px #aaa;
}

h1{
font-size:40px;
}

input{
width:80%;
padding:15px;
margin:10px;
font-size:20px;
border-radius:10px;
border:1px solid #aaa;
}

button{
padding:15px 40px;
font-size:20px;
background:#2563eb;
color:white;
border:0;
border-radius:12px;
cursor:pointer;
}

table{
width:100%;
margin-top:25px;
border-collapse:collapse;
}

td,th{
border:1px solid #ccc;
padding:15px;
}

.win{
font-size:28px;
font-weight:bold;
margin-top:25px;
}

.explain{
font-size:18px;
margin-top:15px;
line-height:1.6;
}

</style>

</head>


<body>


<div class="box">

<h1>🧠 Compare AI</h1>

<p>השווה בין שני דברים וקבל החלטה</p>


<input id="a" placeholder="דבר ראשון">

<br>

<input id="b" placeholder="דבר שני">

<br><br>

<button onclick="compare()">השווה</button>


<div id="result"></div>


</div>



<script>


function compare(){


let a=document.getElementById("a").value.trim();
let b=document.getElementById("b").value.trim();


if(!a || !b){
alert("כתוב שני דברים");
return;
}


if(a.toLowerCase()==b.toLowerCase()){

document.getElementById("result").innerHTML=
"<h2>אי אפשר להשוות דבר לעצמו 😄</h2>";

return;

}


let text=(a+" "+b).toLowerCase();


let categories=[];
let explanation="";


let scoreA=0;
let scoreB=0;



// כדורגל

if(
text.includes("מסי") ||
text.includes("רונאלדו") ||
text.includes("אמבפה") ||
text.includes("האלנד")
){

categories=[
["דריבל",a],
["בעיטות",b],
["מסירות",a],
["כוח פיזי",b],
["סיומת",b]
];

explanation="בהשוואת שחקנים בודקים יכולות שונות כמו טכניקה, בעיטות, כוח והשפעה במשחק.";

}


// טלפונים

else if(
text.includes("אייפון") ||
text.includes("גלקסי") ||
text.includes("iphone") ||
text.includes("samsung")
){

categories=[
["מצלמה",a],
["מחיר",b],
["ביצועים",a],
["סוללה",b],
["עיצוב",a]
];

explanation="בטלפונים אין מכשיר שמנצח בהכול. כל אחד חזק בתחומים שונים.";

}


// נושאים של דעה

else if(
text.includes("אבא") ||
text.includes("אמא")
){

document.getElementById("result").innerHTML=
`

<h2>${a} מול ${b}</h2>

<h3>❤️ השוואה אישית</h3>

<p class="explain">
אין תשובה אחת נכונה. אנשים שונים יבחרו אחרת לפי הקשר האישי,
החוויות והקשר המשפחתי שלהם.
</p>

`;

return;

}


// כללי

else{

categories=[
["איכות",a],
["מחיר",b],
["נוחות",a],
["פופולריות",b],
["יתרונות",a]
];

explanation=
"ההשוואה נעשתה לפי מספר קטגוריות כלליות. בתחומים שונים יכולים להיות יתרונות שונים.";

}



// בניית טבלה


let html=`

<h2>${a} מול ${b}</h2>


<table>

<tr>
<th>קטגוריה</th>
<th>${a}</th>
<th>${b}</th>
</tr>

`;



categories.forEach(c=>{


let category=c[0];
let winner=c[1];


if(winner==a){
scoreA++;
}else{
scoreB++;
}


html+=`

<tr>

<td>${category}</td>

<td>${winner==a ? "✅":""}</td>

<td>${winner==b ? "✅":""}</td>

</tr>

`;

});



let winner;


if(scoreA>scoreB){
winner=a;
}

else{
winner=b;
}



html+=`

</table>


<div class="win">
🏆 המנצח: ${winner}
</div>


<div class="explain">
${explanation}

<br><br>

${winner} ניצח כי קיבל יתרון ביותר קטגוריות בהשוואה הזאת.
</div>

`;



document.getElementById("result").innerHTML=html;


}



</script>


</body>

</html>
