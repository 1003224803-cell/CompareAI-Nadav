<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compare AI</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:Arial, sans-serif;

background:
linear-gradient(135deg,#4f46e5,#9333ea);

min-height:100vh;

display:flex;

justify-content:center;

padding:25px;

}



.container{

background:white;

width:100%;

max-width:950px;

border-radius:30px;

padding:35px;

box-shadow:
0 20px 50px rgba(0,0,0,0.3);

}



.logo{

font-size:50px;

font-weight:bold;

background:
linear-gradient(90deg,#2563eb,#9333ea);

-webkit-background-clip:text;

color:transparent;

}



.subtitle{

font-size:22px;

color:#555;

margin-bottom:30px;

}



input{

width:90%;

max-width:650px;

padding:18px;

margin:10px;

border-radius:15px;

border:2px solid #ddd;

font-size:20px;

}



input:focus{

outline:none;

border-color:#6366f1;

}



button{

padding:16px 35px;

border:0;

border-radius:15px;

font-size:18px;

cursor:pointer;

margin:8px;

background:
linear-gradient(90deg,#2563eb,#7c3aed);

color:white;

transition:.3s;

}



button:hover{

transform:scale(1.05);

}



.result{

margin-top:30px;

}



table{

width:100%;

border-collapse:collapse;

margin-top:25px;

border-radius:15px;

overflow:hidden;

}



th{

background:#eef2ff;

color:#3730a3;

}



td,th{

padding:18px;

border-bottom:1px solid #ddd;

font-size:18px;

}



.check{

font-size:30px;

}



.winner{

margin-top:30px;

background:#fef3c7;

padding:20px;

border-radius:20px;

font-size:30px;

font-weight:bold;

color:#92400e;

}



.explanation{

margin-top:20px;

background:#f8fafc;

padding:25px;

border-radius:20px;

line-height:1.8;

font-size:18px;

}



.history{

margin-top:30px;

background:#f1f5f9;

padding:20px;

border-radius:20px;

}



.history-item{

background:white;

padding:15px;

margin:10px;

border-radius:15px;

}



</style>


</head>


<body>


<div class="container">


<div class="logo">
🧠 Compare AI
</div>


<div class="subtitle">

השוואות חכמות בין אנשים, מקומות ודברים

</div>



<input id="first"
placeholder="לדוגמה: מסי">


<br>


<input id="second"
placeholder="לדוגמה: רונאלדו">


<br>


<button onclick="compare()">
השווה 🚀
</button>


<button onclick="showHistory()">
📜 היסטוריה
</button>


<button onclick="clearHistory()">
🗑 ניקוי
</button>



<div id="result"
class="result">

</div>


<div id="history"
class="history">

</div>



</div>


<script>


let history =
JSON.parse(localStorage.getItem("compareHistory")) || [];


// חלק 2 ייכנס כאן:
// מאגר המידע של השחקנים, הזמרים והיעדים

const database = {


// ⚽ כדורגלנים

"מסי":{

type:"כדורגל",

stats:{

"דריבל":10,
"מסירות":10,
"בעיטות":9,
"מהירות":8,
"כוח פיזי":7,
"סיומת":9,
"תארים":10

}

},


"רונאלדו":{

type:"כדורגל",

stats:{

"דריבל":8,
"מסירות":8,
"בעיטות":10,
"מהירות":9,
"כוח פיזי":10,
"סיומת":10,
"תארים":10

}

},


"אמבפה":{

type:"כדורגל",

stats:{

"דריבל":9,
"מסירות":8,
"בעיטות":9,
"מהירות":10,
"כוח פיזי":8,
"סיומת":9,
"תארים":8

}

},


"האלנד":{

type:"כדורגל",

stats:{

"דריבל":7,
"מסירות":7,
"בעיטות":10,
"מהירות":9,
"כוח פיזי":10,
"סיומת":10,
"תארים":8

}

},


"בלינגהאם":{

type:"כדורגל",

stats:{

"דריבל":9,
"מסירות":9,
"בעיטות":8,
"מהירות":8,
"כוח פיזי":9,
"סיומת":8,
"תארים":7

}

},


// 🎤 זמרים ישראלים


"עומר אדם":{

type:"מוזיקה",

stats:{

"קול":9,
"הופעות":10,
"להיטים":10,
"כתיבה":8,
"פופולריות":10,
"השפעה":9

}

},


"אייל גולן":{

type:"מוזיקה",

stats:{

"קול":10,
"הופעות":9,
"להיטים":10,
"כתיבה":8,
"פופולריות":10,
"השפעה":10

}

},


"עדן חסון":{

type:"מוזיקה",

stats:{

"קול":9,
"הופעות":9,
"להיטים":9,
"כתיבה":9,
"פופולריות":9,
"השפעה":8

}

},


"נועה קירל":{

type:"מוזיקה",

stats:{

"קול":8,
"הופעות":10,
"להיטים":10,
"כתיבה":8,
"פופולריות":10,
"השפעה":9

}

},


"אודיה":{

type:"מוזיקה",

stats:{

"קול":9,
"הופעות":8,
"להיטים":9,
"כתיבה":10,
"פופולריות":9,
"השפעה":8

}

},



// 🌍 יעדים


"אילת":{

type:"יעד",

stats:{

"חופים":10,
"אטרקציות":9,
"אוכל":8,
"מחיר":8,
"מזג אוויר":10

}

},


"ברצלונה":{

type:"יעד",

stats:{

"חופים":8,
"אטרקציות":10,
"אוכל":10,
"מחיר":7,
"מזג אוויר":9

}

},


"פריז":{

type:"יעד",

stats:{

"חופים":5,
"אטרקציות":10,
"אוכל":10,
"מחיר":6,
"מזג אוויר":7

}

},


"לונדון":{

type:"יעד",

stats:{

"חופים":4,
"אטרקציות":10,
"אוכל":9,
"מחיר":6,
"מזג אוויר":6

}

},



// 📱 טכנולוגיה


"אייפון":{

type:"טכנולוגיה",

stats:{

"מצלמה":10,
"ביצועים":10,
"סוללה":8,
"עיצוב":10,
"מחיר":6

}

},


"גלקסי":{

type:"טכנולוגיה",

stats:{

"מצלמה":9,
"ביצועים":9,
"סוללה":10,
"עיצוב":9,
"מחיר":8

}

}

};
  
// מנוע השוואה

function compare(){


let first =
document.getElementById("first").value.trim();


let second =
document.getElementById("second").value.trim();



if(!database[first] || !database[second]){


document.getElementById("result").innerHTML=

`

<div class="explanation">

❌ כרגע אין לי מידע על אחד הדברים.

נסה שמות מתוך המאגר:
<br><br>

⚽ מסי, רונאלדו, אמבפה, האלנד
<br>
🎤 עומר אדם, אייל גולן, נועה קירל
<br>
🌍 אילת, ברצלונה, פריז
<br>
📱 אייפון, גלקסי

</div>

`;

return;

}



if(first===second){

document.getElementById("result").innerHTML=

"<h2>😄 אי אפשר להשוות משהו לעצמו</h2>";

return;

}



let stats1 = database[first].stats;
let stats2 = database[second].stats;


let categories =
Object.keys(stats1);



let scoreFirst = 0;
let scoreSecond = 0;


let rows = "";

let explanation = "";



categories.forEach(category=>{


let value1 = stats1[category] || 0;

let value2 = stats2[category] || 0;


let winner;



if(value1 > value2){

winner = first;
scoreFirst++;

}

else{

winner = second;
scoreSecond++;

}



rows +=

`

<tr>

<td>${category}</td>

<td class="check">

${winner===first ? "✅" : ""}

<br>

${value1}/10

</td>


<td class="check">

${winner===second ? "✅" : ""}

<br>

${value2}/10

</td>


</tr>

`;



explanation +=

`
• בקטגוריית <b>${category}</b>:
${winner} קיבל יתרון 
(${value1 > value2 ? value1 : value2} נקודות).
<br>
`;



});



let finalWinner;



if(scoreFirst > scoreSecond){

finalWinner = first;

}

else{

finalWinner = second;

}



let result =

`

<h2>${first} 🆚 ${second}</h2>

<h3>${database[first].type}</h3>


<table>


<tr>

<th>קטגוריה</th>

<th>${first}</th>

<th>${second}</th>

</tr>


${rows}


</table>



<div class="winner">

🏆 המנצח: ${finalWinner}

</div>



<div class="explanation">


<h3>למה?</h3>


${explanation}


<br>


בסיכום:

<b>${finalWinner}</b> ניצח ב־

${finalWinner===first ? scoreFirst : scoreSecond}

מתוך ${categories.length} קטגוריות.


</div>

`;



document.getElementById("result").innerHTML=result;



// שמירת היסטוריה


let save = {

first:first,

second:second,

winner:finalWinner,

date:new Date().toLocaleString("he-IL")

};



history.unshift(save);



if(history.length>20){

history.pop();

}



localStorage.setItem(

"compareHistory",

JSON.stringify(history)

);



}




// הצגת היסטוריה


function showHistory(){


let box =
document.getElementById("history");



if(history.length===0){

box.innerHTML =
"<h3>אין עדיין השוואות</h3>";

return;

}



let html =
"<h2>📜 השוואות אחרונות</h2>";



history.forEach(item=>{


html +=

`

<div class="history-item">


<b>${item.first}</b>

מול

<b>${item.second}</b>


<br>


🏆 ${item.winner}


<br>


${item.date}


</div>


`;



});


box.innerHTML = html;


}





function clearHistory(){


history=[];


localStorage.removeItem(
"compareHistory"
);


document.getElementById("history").innerHTML=

"<h3>ההיסטוריה נמחקה</h3>";
}
<script src="database.js"></script>
</script>


</body>

</html>
