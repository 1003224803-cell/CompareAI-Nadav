<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compare AI</title>

<style>

*{
box-sizing:border-box;
}

body{

font-family:"Segoe UI", Arial, sans-serif;

background:
linear-gradient(135deg,#667eea,#764ba2);

min-height:100vh;

margin:0;

padding:25px;

display:flex;

justify-content:center;

align-items:center;

}


.container{

background:white;

width:100%;

max-width:900px;

padding:35px;

border-radius:30px;

box-shadow:
0 20px 50px rgba(0,0,0,0.25);

}


h1{

font-size:48px;

margin-bottom:5px;

background:
linear-gradient(90deg,#2563eb,#9333ea);

-webkit-background-clip:text;

color:transparent;

}



p{

color:#555;

font-size:20px;

}



input{

width:90%;

max-width:600px;

padding:18px;

margin:10px;

border-radius:15px;

border:2px solid #ddd;

font-size:20px;

transition:.3s;

}



input:focus{

border-color:#6366f1;

outline:none;

box-shadow:0 0 10px #6366f1;

}



button{

background:
linear-gradient(90deg,#2563eb,#7c3aed);

color:white;

border:none;

padding:16px 35px;

margin:8px;

border-radius:15px;

font-size:18px;

cursor:pointer;

transition:.3s;

}



button:hover{

transform:translateY(-3px);

box-shadow:
0 8px 20px rgba(0,0,0,.2);

}



table{

width:100%;

margin-top:30px;

border-collapse:separate;

border-spacing:0;

overflow:hidden;

border-radius:15px;

}



th{

background:#eef2ff;

color:#3730a3;

}



td,th{

padding:18px;

border-bottom:1px solid #ddd;

font-size:18px;

}



.check{

font-size:30px;

}



.winner{

margin-top:30px;

padding:20px;

border-radius:20px;

background:
linear-gradient(135deg,#fef3c7,#fde68a);

font-size:32px;

color:#92400e;

box-shadow:0 5px 15px #ddd;

}



.explanation{

background:#f8fafc;

padding:20px;

border-radius:20px;

margin-top:20px;

line-height:1.8;

font-size:18px;

}



.history{

margin-top:25px;

background:#f1f5f9;

padding:20px;

border-radius:20px;

}



.item{

background:white;

padding:15px;

margin:10px;

border-radius:15px;

box-shadow:0 3px 10px #ddd;

}



</style>
</head>


<body>


<div class="container">

<h1>🧠 Compare AI</h1>

<p>
השווה בין שני דברים וקבל החלטה חכמה
</p>


<input id="first" placeholder="הכנס דבר ראשון">

<br>

<input id="second" placeholder="הכנס דבר שני">


<br>


<button onclick="compare()">
השווה
</button>


<button onclick="showHistory()">
📜 היסטוריה
</button>


<button onclick="clearHistory()">
🗑 מחק היסטוריה
</button>


<div id="result"></div>


<div id="history"></div>


</div>



<script>


let history =
JSON.parse(localStorage.getItem("compareHistory")) || [];



function randomWinner(a,b){

let r=Math.random();

if(r<0.5){
return a;
}

else{
return b;
}

}



function compare(){


let first =
document.getElementById("first").value.trim();


let second =
document.getElementById("second").value.trim();



if(!first || !second){

alert("צריך להכניס שני דברים");
return;

}



if(first.toLowerCase()==second.toLowerCase()){

document.getElementById("result").innerHTML=
`
<h2>😄 אי אפשר להשוות משהו לעצמו</h2>
`;

return;

}



let text =
(first+" "+second).toLowerCase();



let categories=[];

let type="השוואה כללית";



if(
text.includes("מסי") ||
text.includes("רונאלדו") ||
text.includes("אמבפה") ||
text.includes("האלנד")
){


type="⚽ כדורגל";


categories=[

"מהירות",
"בעיטות",
"דריבל",
"מסירות",
"כוח פיזי",
"סיומת"

];


}



else if(
text.includes("אייפון") ||
text.includes("גלקסי") ||
text.includes("iphone") ||
text.includes("samsung")
){


type="📱 טכנולוגיה";


categories=[

"מצלמה",
"סוללה",
"ביצועים",
"מחיר",
"עיצוב"

];


}


else{


categories=[

"איכות",
"מחיר",
"נוחות",
"פופולריות",
"יתרונות"

];


}


let scoreFirst = 0;
let scoreSecond = 0;

let rows = "";

let details = [];



categories.forEach(category => {


let winner = randomWinner(first, second);


if(winner === first){

scoreFirst++;

}
else{

scoreSecond++;

}


rows += `

<tr>

<td>${category}</td>

<td class="check">
${winner === first ? "✅" : ""}
</td>


<td class="check">
${winner === second ? "✅" : ""}
</td>

</tr>

`;


details.push(
`${category}: היתרון אצל ${winner}`
);


});



let finalWinner;

if(scoreFirst > scoreSecond){

finalWinner = first;

}

else if(scoreSecond > scoreFirst){

finalWinner = second;

}

else{

finalWinner = randomWinner(first, second);

}



let explanation = `

ההשוואה בין <b>${first}</b> לבין <b>${second}</b> נבדקה לפי ${categories.length} קטגוריות בתחום ${type}.

<br><br>

`;



details.forEach(d=>{

explanation += "• " + d + "<br>";

});



explanation += `

<br>

בסיכום הכולל, ${finalWinner} קיבל יותר יתרונות בקטגוריות שנבדקו ולכן נבחר כמנצח.

חשוב לזכור: התוצאה מבוססת על קטגוריות ההשוואה ולא אומרת שכל אדם בהכרח יעדיף אותו.

`;



let result = `


<h2>${first} מול ${second}</h2>

<h3>${type}</h3>


<table>

<tr>

<th>קטגוריה</th>

<th>${first}</th>

<th>${second}</th>

</tr>


${rows}


</table>


<div class="winner">

🏆 המנצח: ${finalWinner}

</div>


<div class="explanation">

${explanation}

</div>


`;



document.getElementById("result").innerHTML = result;



let save = {

first:first,

second:second,

winner:finalWinner,

date:new Date().toLocaleString("he-IL")

};



history.unshift(save);



if(history.length > 20){

history.pop();

}



localStorage.setItem(
"compareHistory",
JSON.stringify(history)
);



}




function showHistory(){


let box = document.getElementById("history");


if(history.length===0){

box.innerHTML =
"<h3>אין עדיין השוואות</h3>";

return;

}



let html = `

<h2>📜 השוואות אחרונות</h2>

`;



history.forEach(item=>{


html += `

<div class="item">

<b>${item.first}</b> מול <b>${item.second}</b>

<br>

🏆 ${item.winner}

<br>

${item.date}

</div>


`;

});


box.innerHTML = html;


}




function clearHistory(){


history=[];


localStorage.removeItem(
"compareHistory"
);


document.getElementById("history").innerHTML =
"<h3>ההיסטוריה נמחקה</h3>";

}


</script>


</body>

</html>
